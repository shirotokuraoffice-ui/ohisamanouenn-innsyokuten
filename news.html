<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お日さま農園｜飲食店様向けお知らせ</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f9f5; color: #333; margin: 0; padding: 16px; }
    .header { background: #2e7d32; color: #fff; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 19px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #c8e6c9; }
    .badge { display: inline-block; background: #1b5e20; color: #fff; font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 12px; margin-bottom: 10px; }
    .content { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .updated { text-align: right; font-size: 12px; color: #777; margin-top: 10px; }
    .nav-btn { display: block; text-align: center; background: #2e7d32; color: #fff; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📢 農園からのご案内（業務用）</h1>
  </div>

  <div class="card">
    <span class="badge" id="news-title">最新のご案内</span>
    <div id="news-body" class="content">お知らせを読み込んでいます...</div>
    <div id="updated" class="updated"></div>
  </div>

  <a href="index.html" class="nav-btn">🥦 今週の出荷野菜・単価一覧を見る</a>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyrV9JwSEdLESXoGtakwTITbWd3c1rE3Ywd0l-hr_GhUwdsrFFiW2uJjsj1kmIG1DkD7w/exec";

    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById('news-title').textContent = data.newsTitle || data.period || '最新情報';
        document.getElementById('news-body').textContent = data.newsBody || data.message || '';
        document.getElementById('updated').textContent = '最終更新: ' + (data.updatedAt || '');
      })
      .catch(() => {
        document.getElementById('news-body').textContent = '現在、情報を更新中です。';
      });
  </script>
</body>
</html>
