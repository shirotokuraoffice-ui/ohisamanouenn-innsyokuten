<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お日さま農園｜飲食店様向け 今週の旬野菜</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f9f5; color: #333; margin: 0; padding: 16px; }
    .header { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: #fff; padding: 18px 16px; border-radius: 14px; text-align: center; margin-bottom: 16px; box-shadow: 0 3px 8px rgba(27,94,32,0.2); }
    .header h1 { margin: 0; font-size: 19px; letter-spacing: 0.5px; }
    .header p { margin: 8px 0 0; font-size: 13px; background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #c8e6c9; }
    .card-title { font-weight: bold; color: #1b5e20; font-size: 16px; margin-bottom: 12px; border-bottom: 2px solid #c8e6c9; padding-bottom: 6px; }
    .veg-card { padding: 12px; background: #fff; border: 1px solid #e0e0e0; border-left: 5px solid #2e7d32; border-radius: 8px; margin-bottom: 10px; }
    .veg-card.recommend { background: #f1f8e9; border-left-color: #2e7d32; }
    .veg-card.few { background: #fff8f8; border-left-color: #d32f2f; }
    .veg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .veg-name { font-weight: bold; font-size: 16px; color: #1b5e20; }
    .veg-price { font-weight: bold; font-size: 15px; color: #333; background: #e8f5e9; padding: 3px 8px; border-radius: 6px; }
    .badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-bottom: 4px; }
    .badge.rec { background: #2e7d32; color: #fff; }
    .badge.normal { background: #78909c; color: #fff; }
    .badge.few { background: #d32f2f; color: #fff; }
    .veg-note { font-size: 13px; color: #555; margin-top: 4px; }
    .order-btn { display: block; text-align: center; background: #ef6c00; color: #fff; text-decoration: none; font-weight: bold; font-size: 16px; padding: 14px; border-radius: 10px; margin: 14px 0; box-shadow: 0 3px 6px rgba(239,108,0,0.25); }
    .nav-btn { display: block; text-align: center; background: #2e7d32; color: #fff; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 10px; margin-top: 10px; }
    .updated { text-align: right; font-size: 12px; color: #777; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🥦 お日さま農園【飲食店専用】</h1>
    <p id="period">ラインナップ読み込み中...</p>
  </div>

  <div class="card">
    <div class="card-title">🌱 西尾からのご連絡</div>
    <div id="message" style="font-size:14px; line-height:1.6;">最新の出荷情報を取得しています...</div>
    <a id="top-order-btn" href="#" target="_blank" class="order-btn" style="display:none;">📝 このまま注文フォームへ進む</a>
  </div>

  <div class="card">
    <div class="card-title">📋 今週の出荷野菜・単価一覧（税込）</div>
    <div id="veg-list"></div>
    <div id="updated" class="updated"></div>
  </div>

  <a id="bottom-order-btn" href="#" target="_blank" class="order-btn" style="display:none;">📝 注文フォームを開く</a>
  <a href="guide.html" class="nav-btn">📖 発注ルール・ご利用ガイドを見る</a>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyrV9JwSEdLESXoGtakwTITbWd3c1rE3Ywd0l-hr_GhUwdsrFFiW2uJjsj1kmIG1DkD7w/exec";

    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById('period').textContent = data.period || '今週の出荷ラインナップ';
        document.getElementById('message').textContent = data.message || '';
        document.getElementById('updated').textContent = '最終更新: ' + (data.updatedAt || '');

        if (data.formUrl && data.formUrl.startsWith('http')) {
          const topBtn = document.getElementById('top-order-btn');
          const btmBtn = document.getElementById('bottom-order-btn');
          topBtn.href = data.formUrl;
          btmBtn.href = data.formUrl;
          topBtn.style.display = 'block';
          btmBtn.style.display = 'block';
        }

        const listEl = document.getElementById('veg-list');
        listEl.innerHTML = '';
        (data.items || []).forEach(item => {
          const div = document.createElement('div');
          const isFew = String(item.status).includes('残りわずか');
          const isRec = String(item.status).includes('おすすめ');
          div.className = 'veg-card ' + (isFew ? 'few' : (isRec ? 'recommend' : ''));
          const badgeClass = isFew ? 'few' : (isRec ? 'rec' : 'normal');
          div.innerHTML = `
            <span class="badge ${badgeClass}">${item.status || '出荷中'}</span>
            <div class="veg-top">
              <span class="veg-name">${item.name}</span>
              <span class="veg-price">${Number(item.price).toLocaleString()}円</span>
            </div>
            ${item.note ? `<div class="veg-note">💡 ${item.note}</div>` : ''}
          `;
          listEl.appendChild(div);
        });
      })
      .catch(() => {
        document.getElementById('message').textContent = '現在、ラインナップ情報を更新中です。しばらく経ってから再度開いてください。';
      });
  </script>
</body>
</html>
